<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>偶的工作台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" id="bgLayer"></div>
  <div class="veil" id="veilLayer"></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <div class="brand-name" id="brandName">偶的工作台</div>
        <div class="brand-date" id="brandDate"></div>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="today">今日</button>
        <button class="nav-item" data-view="schedule">日程</button>
        <button class="nav-item" data-view="habits">习惯</button>
        <button class="nav-item" data-view="review">复盘</button>
        <button class="nav-item" data-view="settings">设置</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="view active" id="view-today">
      <div id="todayHero"></div>
      <div id="todayTasks"></div>
      <div id="todayFocus"></div>
      <div id="todaySchedule"></div>
      <div id="todayHabits"></div>
      <div id="todaySleep"></div>
    </section>

    <section class="view" id="view-schedule">
      <div id="scheduleTasks"></div>
      <div id="scheduleWeek"></div>
    </section>

    <section class="view" id="view-habits">
      <div id="habitsMain"></div>
      <div id="habitsWeek"></div>
    </section>

    <section class="view" id="view-review">
      <div id="reviewQuestions"></div>
      <div id="reviewWeek"></div>
    </section>

    <section class="view" id="view-settings">
      <div id="settingsBg"></div>
      <div id="settingsVeil"></div>
      <div id="settingsName"></div>
      <div id="settingsData"></div>
    </section>
  </main>

  <div class="mascot-corner" id="cornerMascot">
    <div class="mascot-box">
      <img src="assets/mascot.png" alt="小搭档">
      <div class="bubble"><span class="bubble-text"></span></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
